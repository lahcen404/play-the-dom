<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        <h1 class="title">TYPING GAME</h1>
        <div class="container">
            <div class="message">
                You are Playing On
                <span class="lvl"></span> Level and You have <span class="seconds"></span> Seconds to type the Word 
            </div>
            <button id="start">Let's Play - Start</button>
            <div class="the-word"></div>
            <input type="text" class="input" placeholder="Type here...">
            <div class="control">
                <div class="time">Time Left : <span></span> Seconds</div>
                <div class="high-score">High Score :</div>
                <div class="score">Score: <span class="got">0</span> From <span class="total"></span></div>
                
            </div>
            <div class="finish"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
